name: Factory improve

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  improve:
    if: vars.FACTORY_IMPROVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: factory-improve
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub CLI git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.FACTORY_ANTHROPIC_API_KEY }}
          prompt: /improve 7
          claude_args: >-
            --permission-mode acceptEdits
            --allowedTools "Agent,Read,Grep,Glob,Edit,Write,Bash(git *),Bash(gh *)"
